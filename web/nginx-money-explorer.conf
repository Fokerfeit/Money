location = /explorer {
    default_type text/html;
    alias /var/www/money-explorer/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Content-Security-Policy "default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://testnet.moneyforeveryone.app https://api.moneyforeveryone.app; base-uri 'none'; frame-ancestors 'none'";
}
