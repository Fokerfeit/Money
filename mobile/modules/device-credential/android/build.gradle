plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.devicecredential'
version = '0.1.0'

android {
  namespace "expo.modules.devicecredential"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Same androidx.biometric that expo-local-authentication already ships — no new version in the APK.
  implementation "androidx.biometric:biometric:1.2.0-alpha04"
}
